<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>رواد المشاعر — عروض الأسعار والمقايسات</title>
<meta name="theme-color" content="#0b4f9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="رواد المشاعر">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="favicon.png?v=3">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:Arial,"Segoe UI",Tahoma,sans-serif;background:#eef2f7}
  #top{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#0b4f9c;z-index:3}
  #bot{position:fixed;bottom:0;left:0;right:0;height:env(safe-area-inset-bottom,0px);background:#fff;z-index:3}
  #app{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:100%;height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border:0;display:block;background:#eef2f7}
  .full{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
        padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));background:#fff}
  .lg{display:flex;gap:18px;align-items:center;justify-content:center;margin-bottom:14px}
  .lg img{height:72px}
  .co{color:#667085;font-size:15px;margin-bottom:4px}
  .app{color:#0b4f9c;font-size:20px;font-weight:bold}
  .dep{display:inline-block;color:#fff;background:#0b4f9c;font-size:14px;font-weight:bold;padding:4px 16px;border-radius:20px;margin:6px 0 10px;letter-spacing:.5px}
  .dots{margin-top:26px;display:flex;gap:8px}
  .dots i{width:10px;height:10px;border-radius:50%;background:#0b4f9c;opacity:.25;animation:b 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{50%{opacity:1}}
  .hide{display:none!important}
  /* visitor (client scanned a sticker without being logged in) */
  .unit{margin:22px 0 6px;font-size:17px;color:#172033}
  .unit b{font-size:26px;color:#0b4f9c;display:block;margin-top:4px;direction:ltr}
  .call{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:360px;margin-top:22px;padding:18px;border-radius:16px;
        background:#c0392b;color:#fff;font-size:20px;font-weight:bold;text-decoration:none;box-shadow:0 6px 18px rgba(192,57,43,.3)}
  .call small{display:block;font-size:14px;font-weight:normal;opacity:.95}
  .note{color:#667085;font-size:14px;margin-top:12px;line-height:1.7}
  .staff{margin-top:34px;background:none;border:1.5px solid #0b4f9c;color:#0b4f9c;border-radius:14px;padding:12px 22px;font-size:15px;font-family:inherit}
  /* install hint */
  #hint{position:fixed;left:10px;right:10px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:6;background:#172033;color:#fff;border-radius:16px;padding:14px 16px;
        font-size:14.5px;line-height:1.7;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #hint b{color:#ffd166}
  #hint button{position:absolute;top:6px;left:8px;background:none;border:0;color:#fff;font-size:22px;padding:4px 8px}
  /* client quote page */
  #qp{position:fixed;inset:0;z-index:5;overflow:auto;background:linear-gradient(180deg,#0b4f9c 0,#0b4f9c 210px,#eef2f7 210px);
      padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));font-family:Arial,Tahoma,sans-serif;color:#172033}
  #qp.S{background:linear-gradient(180deg,#9e2a20 0,#9e2a20 210px,#f6eeed 210px)}
  .qw{max-width:460px;margin:0 auto}
  .qh{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:16px;animation:qIn .5s both}
  .qh img{height:54px;background:#fff;border-radius:14px;padding:6px}
  .qh b{display:block;font-size:17px}.qh span{font-size:13px;opacity:.85}
  .qc{background:#fff;border-radius:22px;padding:20px 18px;box-shadow:0 12px 40px rgba(16,24,40,.18);animation:qIn .55s .08s both}
  .qt{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .qt .tg{font-size:13px;font-weight:bold;color:#0b4f9c;background:#e8f0fb;border-radius:20px;padding:4px 12px}
  #qp.S .qt .tg{color:#9e2a20;background:#fbeceb}
  .qt .cd{direction:ltr;font-size:13px;color:#667085}
  .qcl{font-size:21px;font-weight:bold;margin:4px 0 2px}
  .qloc{color:#667085;font-size:14.5px;margin-bottom:14px}
  .qtot{background:#f4f7fb;border-radius:16px;padding:14px;text-align:center;margin-bottom:6px}
  .qtot small{display:block;color:#667085;font-size:13px}
  .qtot b{font-size:34px;color:#0b4f9c;letter-spacing:.5px}
  #qp.S .qtot b{color:#9e2a20}
  .qtot i{font-style:normal;font-size:15px;color:#667085}
  .qmeta{display:flex;justify-content:space-between;color:#667085;font-size:13.5px;margin:10px 4px 4px}
  .qb{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:bold;
      font-family:inherit;margin-top:12px;text-decoration:none;transition:transform .12s;animation:qIn .5s both}
  .qb:active{transform:scale(.97)}
  .qb.pdf{background:#fff;color:#0b4f9c;border:2px solid #0b4f9c;animation-delay:.16s}
  #qp.S .qb.pdf{color:#9e2a20;border-color:#9e2a20}
  .qb.ok{background:#1b7a43;color:#fff;box-shadow:0 8px 22px rgba(27,122,67,.35);animation-delay:.22s}
  .qb.wa{background:#e9f8ef;color:#13703a;animation-delay:.28s;font-size:16px}
  .qb.tel{background:transparent;color:#667085;font-size:15px;font-weight:normal;padding:10px;animation-delay:.32s}
  .qok{background:#e9f8ef;border:1.5px solid #9fd9b5;color:#13703a;border-radius:16px;padding:14px;text-align:center;margin-top:14px;font-size:15.5px;line-height:1.7;animation:qIn .5s both}
  .qok b{font-size:19px;display:block}
  .qex{background:#fff4e0;border:1.5px solid #f3d39b;color:#8a5a00;border-radius:16px;padding:12px 14px;margin-top:14px;font-size:15px;line-height:1.7}
  .qsheet{position:fixed;inset:0;z-index:8;background:rgba(23,32,51,.55);display:flex;align-items:flex-end;justify-content:center}
  .qsheet>div{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:qUp .32s cubic-bezier(.2,.9,.3,1.1)}
  .qsheet h3{margin:0 0 6px;color:#1b7a43;font-size:20px}
  .qsheet p{margin:0 0 12px;color:#3b4a63;line-height:1.7;font-size:15px}
  .qsheet input{width:100%;padding:14px;border:1.5px solid #d5dbe5;border-radius:14px;font-size:16px;font-family:inherit}
  .qsheet .no{background:#fff;color:#667085;border:1.5px dashed #c9d1dd;font-size:16px}
  .qdone{text-align:center;padding:10px 0}
  .qdone .ck{width:92px;height:92px;border-radius:50%;background:#1b7a43;color:#fff;font-size:52px;line-height:92px;margin:0 auto 12px;animation:pop .5s cubic-bezier(.2,.9,.3,1.4) both}
  .qft{text-align:center;color:#98a2b3;font-size:12.5px;margin-top:18px}
  @keyframes qIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes qUp{from{transform:translateY(100%)}to{transform:none}}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
</style>
<script src="config.js"></script>
</head>
<body>
<div id="top"></div>

<!-- splash -->
<div id="splash" class="full">
  <div class="lg"><img src="logo-e.png" alt=""><img src="logo-s.png" alt=""></div>
  <div class="co">شركة رواد المشاعر لأجهزة السلامة والمصاعد</div>
  <div class="dep">الإدارة الهندسية</div>
  <div class="app">تطبيق عروض الأسعار والمقايسات</div>
  <div class="dots"><i></i><i></i><i></i></div>
</div>

<!-- visitor page (sticker scanned by someone not logged in) -->
<div id="visitor" class="full hide">
  <div class="lg"><img src="logo-e.png" alt=""><img src="logo-s.png" alt=""></div>
  <div class="co">شركة رواد المشاعر لأجهزة السلامة والمصاعد</div>
  <div class="unit" id="vUnit"></div>
  <a class="call" id="vCall" href="#"><span>📞</span><span>اتصال طوارئ<small id="vNum"></small></span></a>
  <div class="note">خدمة الأعطال والطوارئ على مدار الساعة</div>
  <button class="staff" onclick="openApp()">دخول فريق العمل</button>
</div>

<iframe id="app" class="hide" title="عروض الأسعار" allow="camera; clipboard-write; geolocation"></iframe>
<div id="bot"></div>

<!-- share the real PDF (the app asks; the tap must happen on this main page) -->
<div id="shareBox" class="full hide" style="background:rgba(23,32,51,.55);z-index:7">
  <div style="background:#fff;border-radius:18px;padding:20px;width:100%;max-width:380px">
    <div style="font-size:18px;font-weight:bold;color:#0b4f9c;margin-bottom:6px">الملف جاهز</div>
    <div id="shareName" style="color:#667085;font-size:14px;margin-bottom:14px;word-break:break-all"></div>
    <button id="shareGo" style="width:100%;padding:16px;border:0;border-radius:14px;background:#1b7a43;color:#fff;font-size:18px;font-weight:bold;font-family:inherit">مشاركة الملف</button>
    <button onclick="closeShare(false)" style="width:100%;padding:12px;margin-top:10px;border:1.5px solid #0b4f9c;border-radius:14px;background:#fff;color:#0b4f9c;font-size:16px;font-family:inherit">رجوع</button>
    <div id="shareNote" style="color:#667085;font-size:13px;margin-top:10px;line-height:1.6">هتفتح قايمة المشاركة — اختار واتساب وبعدين العميل.</div>
  </div>
</div>

<div id="qp" class="hide"><div class="qw" id="qpw"></div></div>
<div id="qs" class="qsheet hide" onclick="if(event.target===this)qClose()"><div id="qsb"></div></div>

<div id="hint" class="hide">
  <button onclick="hideHint()">×</button>
  <div id="hintTxt"></div>
</div>

<script>
var KEY='rq_token', HINT='rq_hint_done';
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function ssGet(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } }
function ssSet(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} }
function ssDel(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
function $(i){ return document.getElementById(i); }
function token(){ return lsGet(KEY) || ssGet(KEY) || ''; }

// sticker params: ?e=1001 (elevator) or ?b=S017 (safety building)
var P = new URLSearchParams(location.search);
var QE = (P.get('e')||'').replace(/\D/g,'').slice(0,6);
var QB = (P.get('b')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
var QQ = (P.get('q')||'').toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,24); // a quote code (link sent to Ali)

function openApp(){
  $('visitor').classList.add('hide'); $('splash').classList.remove('hide');
  var u = APP_URL + '?w=1' + (QE?'&e='+QE:'') + (QB?'&b='+QB:'') + (QQ?'&q='+QQ:'');
  var f=$('app'); f.src=u; f.classList.remove('hide');
  // drop the sticker params from the address so a refresh doesn't reopen the same building
  if(QE||QB||QQ){ try{ history.replaceState(null,'',location.pathname); }catch(e){} }
  setTimeout(function(){ $('splash').classList.add('hide'); }, 12000); // safety net
}

function showVisitor(){
  $('splash').classList.add('hide');
  $('vUnit').innerHTML = QE ? 'مصعد رقم<b>'+QE+'</b>' : 'مبنى رقم<b>'+parseInt(QB.replace(/\D/g,''),10)+'</b>';
  $('vNum').textContent = EMERGENCY; $('vCall').href = 'tel:'+EMERGENCY;
  $('visitor').classList.remove('hide');
}

// messages from the app inside the frame
window.addEventListener('message', function(ev){
  var o = ev.origin || '';
  if(!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o) && o!=='https://script.google.com') return;
  var d = ev.data || {};
  if(d.rq==='ready'){
    ev.source.postMessage({rq:'init', token: token()}, o);
    $('splash').classList.add('hide');
  } else if(d.rq==='token' && d.token){
    if(d.remember){ lsSet(KEY,d.token); ssDel(KEY); } else { ssSet(KEY,d.token); lsDel(KEY); }
    maybeHint();
  } else if(d.rq==='logout'){
    lsDel(KEY); ssDel(KEY);
  } else if(d.rq==='share' && d.b64){
    openShare(d, ev.source, o);
  }
});

var SHARE = null;
function openShare(d, src, origin){
  var file;
  try{
    var bin = atob(d.b64), arr = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    file = new File([arr], d.name || 'quote.pdf', {type:'application/pdf'});
  }catch(e){ src.postMessage({rq:'shared', ok:false}, origin); return; }
  SHARE = {file:file, text:d.text||'', src:src, origin:origin};
  $('shareName').textContent = file.name;
  var can = navigator.canShare && navigator.canShare({files:[file]});
  $('shareGo').textContent = can ? 'مشاركة الملف' : 'تحميل الملف';
  $('shareNote').textContent = can ? 'هتفتح قايمة المشاركة — اختار واتساب وبعدين العميل.' : 'الجهاز ده مش بيدعم مشاركة الملفات — هيتحمّل الملف وابعته انت.';
  $('shareBox').classList.remove('hide');
}
$('shareGo').onclick = function(){
  if(!SHARE) return;
  var s = SHARE;
  if(navigator.canShare && navigator.canShare({files:[s.file]})){
    navigator.share(s.text ? {files:[s.file], text:s.text} : {files:[s.file]}).then(function(){ closeShare(true); }).catch(function(){ closeShare(false); });
  } else {
    var u = URL.createObjectURL(s.file), a = document.createElement('a');
    a.href = u; a.download = s.file.name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 4000);
    closeShare(false);
  }
};
function closeShare(ok){
  $('shareBox').classList.add('hide');
  if(SHARE){ try{ SHARE.src.postMessage({rq:'shared', ok:!!ok}, SHARE.origin); }catch(e){} }
  SHARE = null;
}

// one-time tip: add the icon to the home screen
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone===true; }
function maybeHint(){
  if(standalone() || lsGet(HINT)) return;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  $('hintTxt').innerHTML = ios
    ? 'ثبّت التطبيق على الشاشة الرئيسية:<br>اضغط <b>مشاركة ⬆︎</b> تحت، وبعدين <b>إضافة إلى الشاشة الرئيسية</b>.'
    : 'ثبّت التطبيق على الشاشة الرئيسية:<br>اضغط <b>⋮</b> فوق، وبعدين <b>تثبيت التطبيق</b> أو <b>إضافة إلى الشاشة الرئيسية</b>.';
  $('hint').classList.remove('hide');
}
function hideHint(){ $('hint').classList.add('hide'); lsSet(HINT,'1'); }

// a client's quote link: …/?pdf=CODE&k=KEY → always opens the latest PDF of that quote
var QPDF = (P.get('pdf')||'').toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,24);
var QK = (P.get('k')||'').replace(/[^A-Za-z0-9]/g,'').slice(0,20);
var QD = null;
function openPdf(){
  $('splash').querySelector('.app').textContent = 'جاري فتح عرض السعر…';
  fetch(APP_URL + '?api=pdf&code=' + encodeURIComponent(QPDF) + '&k=' + encodeURIComponent(QK))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok) return pdfError(d.error || 'الرابط ده مش شغال', d.phone || EMERGENCY);
      if(!d.client){ location.replace(d.url); return; }   // older server: straight to the PDF
      QD = d; showQuote();
    })
    .catch(function(){ pdfError('مفيش اتصال — جرّب تاني بعد شوية', EMERGENCY); });
}
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(n){ n=Number(n)||0; return n.toLocaleString('en-US',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}); }
function waLink(txt){ return 'https://wa.me/' + (QD.wa||'') + '?text=' + encodeURIComponent(txt); }
function showQuote(){
  var d=QD, S=d.dept==='S';
  var co = S ? 'شركة رواد المشاعر للأمن والسلامة' : 'شركة رواد المشاعر للمصاعد';
  $('qp').className = S ? 'S' : '';
  var h = '<div class="qh"><img src="'+(S?'logo-s.png':'logo-e.png')+'" alt=""><div><b>'+co+'</b><span>عرض سعر</span></div></div>'+
    '<div class="qc"><div class="qt"><span class="tg">عرض سعر</span><span class="cd">'+esc(d.code)+'</span></div>'+
      '<div class="qcl">'+esc(d.client)+'</div><div class="qloc">'+esc(d.location)+'</div>'+
      '<div class="qtot"><small>الإجمالي شامل الضريبة</small><b>'+money(d.total)+'</b> <i>ريال</i></div>'+
      '<div class="qmeta"><span>'+d.items+' بند</span><span>'+esc(d.date)+(d.dateH?' · '+esc(d.dateH)+' هـ':'')+'</span></div>'+
      (d.expires && !d.approved && !d.expired ? '<div class="qmeta" style="justify-content:center;margin-top:2px">العرض ساري لحد <bdi dir="ltr">'+esc(d.expires)+'</bdi></div>' : '')+
      '<a class="qb pdf" href="'+esc(d.url)+'">عرض الملف وتحميله (PDF)</a>';
  if(d.approved) h += '<div class="qok"><b>✓ تمت الموافقة على العرض</b>'+(d.approvedAt?'بتاريخ <bdi dir="ltr">'+esc(d.approvedAt)+'</bdi><br>':'')+(d.done?'والأعمال اتنفذت — شكرًا لثقتكم':'فريقنا هيتواصل معاكم لتحديد موعد التنفيذ')+'</div>';
  else if(d.expired) h += '<div class="qex">مدة العرض انتهت يوم <bdi dir="ltr">'+esc(d.expires)+'</bdi> — الأسعار ممكن تكون اتغيرت. كلّمنا ونحدّث لك العرض في نفس اليوم.</div>'+
      '<a class="qb ok" href="'+waLink('السلام عليكم، محتاج تحديث عرض السعر رقم '+d.code+' — '+d.client)+'">اطلب تحديث العرض</a>';
  else if(d.canApprove) h += '<button class="qb ok" onclick="askApprove()">✓ أوافق على العرض</button>';
  h += '<a class="qb wa" href="'+waLink('السلام عليكم، عندي استفسار عن عرض السعر رقم '+d.code+' — '+d.client)+'">عندي استفسار — واتساب</a>'+
       '<a class="qb tel" href="tel:'+esc(d.phone||EMERGENCY)+'">اتصال: '+esc(d.phone||EMERGENCY)+'</a></div>'+
    '<div class="qft">'+co+' — مكة المكرمة</div>';
  $('qpw').innerHTML = h;
  $('splash').classList.add('hide'); $('qp').classList.remove('hide');
}
function askApprove(){
  $('qsb').innerHTML = '<h3>الموافقة على عرض السعر</h3>'+
    '<p>عرض رقم <b dir="ltr">'+esc(QD.code)+'</b><br>الإجمالي <b>'+money(QD.total)+'</b> ريال شامل الضريبة.<br>بالضغط على «موافق» بتأكد موافقتك على العرض وشروطه.</p>'+
    '<input id="qName" placeholder="اسمك (اختياري)" maxlength="60">'+
    '<button class="qb ok" id="qGo" onclick="doApprove()">موافق</button>'+
    '<button class="qb no" onclick="qClose()">رجوع</button>';
  $('qs').classList.remove('hide');
}
function qClose(){ $('qs').classList.add('hide'); }
function doApprove(){
  var b=$('qGo'); b.disabled=true; b.textContent='جاري التسجيل…';
  var nm=($('qName').value||'').trim();
  fetch(APP_URL + '?api=approve&code=' + encodeURIComponent(QPDF) + '&k=' + encodeURIComponent(QK) + '&name=' + encodeURIComponent(nm))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok){ $('qsb').innerHTML='<p style="color:#c0392b;font-weight:bold">'+esc(d.error||'حصلت مشكلة')+'</p><button class="qb no" onclick="qClose()">رجوع</button>'; return; }
      QD=d; showQuote();
      $('qsb').innerHTML='<div class="qdone"><div class="ck">✓</div><h3>شكرًا لك'+(nm?' يا '+esc(nm):'')+'</h3>'+
        '<p>موافقتك على العرض اتسجلت، وفريقنا هيتواصل معاك لتحديد موعد التنفيذ.</p></div>'+
        '<a class="qb wa" style="animation:none" href="'+waLink('السلام عليكم، وافقت على عرض السعر رقم '+d.code+' — '+d.client+(nm?' ('+nm+')':''))+'">ابلغنا على واتساب (اختياري)</a>'+
        '<button class="qb no" onclick="qClose()">تمام</button>';
    })
    .catch(function(){ b.disabled=false; b.textContent='مفيش اتصال — اضغط تاني'; });
}
function pdfError(m, phone){
  $('splash').classList.add('hide');
  $('vUnit').innerHTML = m.replace(/</g,'&lt;');
  $('vNum').textContent = phone; $('vCall').href = 'tel:' + phone;
  $('visitor').querySelector('.staff').classList.add('hide');
  $('visitor').classList.remove('hide');
}

// start
if(QPDF && QK) openPdf();
else if((QE||QB) && !token()) showVisitor(); else openApp();

if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
</script>
